title: Miloš Vasić
tagline: AI Engineer — Verifiable AI-Development Systems
description: >-
  Miloš Vasić — AI engineer building verifiable AI-development systems:
  autonomous coding agents, LLM orchestration, and constitution-governed
  tooling. 15+ years shipping production software across mobile, backend,
  desktop, and web.
author: Miloš Vasić
url: "https://milosvasic.ru"
lang: en

# Custom theme (no remote/gem theme — fully self-contained layouts + assets)
# SEO — Open Graph, Twitter Card, structured data (generated by jekyll-seo-tag)
# No Twitter/X handle: omitting `twitter.username` prevents jekyll-seo-tag from
# emitting a broken `twitter:site content="@"` tag (an empty username still
# rendered the bare "@").
social:
  name: Miloš Vasić
  links:
    - https://github.com/milos85vasic
    - https://gitlab.com/milos85vasic
    - https://t.me/milos85vasic
logo: /assets/images/profile-square-800.jpg

# Default OG image for all pages (used when no page-specific image is set)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/profile-square-800.jpg

plugins:
  - jekyll-seo-tag
  - jekyll-feed

# Build hygiene
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README.pdf
  - LICENSE
  - start.sh
  - vendor
  - Upstreamable
  - Upstreams
  - .run
  - downloads/src

sass:
  style: compressed
